<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 80" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#c9a84c"/>
      <stop offset="100%" stop-color="#e4c97e"/>
    </linearGradient>
    <linearGradient id="caramelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d4a373"/>
      <stop offset="100%" stop-color="#bc8a5f"/>
    </linearGradient>
  </defs>

  <!-- Taza de café -->
  <g transform="translate(12, 22)">
    <!-- Cuerpo de la taza -->
    <rect x="0" y="4" width="28" height="24" rx="3" fill="url(#caramelGrad)" opacity="0.9"/>
    <!-- Asa -->
    <path d="M28 10 Q38 10 38 18 Q38 26 28 26" stroke="url(#caramelGrad)" stroke-width="2.5" fill="none" opacity="0.7"/>
    <!-- Café dentro -->
    <rect x="3" y="12" width="22" height="12" rx="2" fill="#3a2418" opacity="0.6"/>
    <!-- Vapor formando patito -->
    <g stroke="url(#goldGrad)" stroke-width="1.5" fill="none" opacity="0.6" stroke-linecap="round">
      <path d="M8 4 Q10 0 14 2 Q18 4 20 0"/>
      <path d="M14 2 Q16 -2 18 0"/>
    </g>
    <!-- Platillo -->
    <ellipse cx="14" cy="30" rx="20" ry="3" fill="url(#caramelGrad)" opacity="0.4"/>
    <!-- Ojo del patito (en el vapor) -->
    <circle cx="15.5" cy="0.5" r="1" fill="url(#goldGrad)" opacity="0.7"/>
  </g>

  <!-- Dulce Patojo (texto) -->
  <text x="52" y="36" font-family="'Playfair Display', Georgia, serif" font-size="22" font-weight="700" fill="url(#goldGrad)" letter-spacing="1">Dulce Patojo</text>

  <!-- Subtítulo -->
  <text x="52" y="54" font-family="'DM Sans', Arial, sans-serif" font-size="9" font-weight="500" fill="#8a8070" letter-spacing="3">CAFETERÍA · S.A.C.</text>
</svg>
